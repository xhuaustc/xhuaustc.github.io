<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1200" viewBox="0 0 520 1200" role="img" aria-labelledby="title desc">
  <title id="title">技术文档审查原型的处理流水线</title>
  <desc id="desc">固定原文后提取声明与定位，检索证据并保存快照，分别进行确定性检查和语义判断，再去重反查，由作者裁决。语义判断需要证据与人工复核，工具错误单独记录。这是本文的自建原型设计。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52718c"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #19334a; }
      .heading { font-size: 29px; font-weight: 700; }
      .step { font-size: 25px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 21px; fill: #496077; }
      .box { fill: #ffffff; stroke: #b9cddd; stroke-width: 2; }
      .flow { fill: none; stroke: #52718c; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="520" height="1200" rx="20" fill="#f3f7fb"/>
  <text x="260" y="48" text-anchor="middle" class="heading">从原文到可复核的问题清单</text>

  <rect x="28" y="82" width="464" height="108" rx="14" class="box"/>
  <text x="52" y="120" class="step">1 · 固定原文</text>
  <text x="52" y="157" class="body">保存版本、全文快照与 SHA-256</text>
  <path d="M260 192 V222" class="flow"/>

  <rect x="28" y="234" width="464" height="112" rx="14" class="box"/>
  <text x="52" y="273" class="step">2 · 提取声明与定位</text>
  <text x="52" y="311" class="body">原句 · 位置 · 版本 · 条件 · 依赖</text>
  <path d="M260 348 V378" class="flow"/>

  <rect x="28" y="390" width="464" height="112" rx="14" class="box"/>
  <text x="52" y="429" class="step">3 · 检索证据并保存快照</text>
  <text x="52" y="467" class="body">读取来源，绑定片段、时间与版本</text>
  <path d="M260 504 V534" class="flow"/>

  <rect x="28" y="546" width="464" height="246" rx="14" class="box"/>
  <text x="52" y="585" class="step">4 · 按检查对象分流</text>
  <rect x="48" y="605" width="424" height="74" rx="10" fill="#e8f4ee"/>
  <text x="65" y="634" class="body" font-weight="700" style="fill:#176745">确定性检查</text>
  <text x="65" y="663" class="small">定位 · 引文 · 数值 · 代码验证</text>
  <rect x="48" y="695" width="424" height="76" rx="10" fill="#e9f0fd"/>
  <text x="65" y="725" class="body" font-weight="700" style="fill:#24589c">语义判断</text>
  <text x="65" y="755" class="small">事实 · 条件 · 版本 · 推理关系</text>
  <path d="M260 794 V824" class="flow"/>

  <rect x="28" y="836" width="464" height="112" rx="14" class="box"/>
  <text x="52" y="875" class="step">5 · 去重与反向复查</text>
  <text x="52" y="913" class="body">检查批评是否成立，合并相同根因</text>
  <path d="M260 950 V980" class="flow"/>

  <rect x="28" y="992" width="464" height="128" rx="14" fill="#fff5e4" stroke="#d8b87b" stroke-width="2"/>
  <text x="52" y="1031" class="step">6 · 作者裁决与修订</text>
  <text x="52" y="1068" class="body">确认问题 / 驳回 / 要求补充证据</text>
  <text x="52" y="1099" class="small">待核验状态不能当作自动判错</text>
  <text x="260" y="1164" text-anchor="middle" class="small">全程保留检查边界，工具错误单独记录</text>
</svg>
