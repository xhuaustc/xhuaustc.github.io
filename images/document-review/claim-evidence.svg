<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1160" viewBox="0 0 520 1160" role="img" aria-labelledby="title desc">
  <title id="title">声明、原文定位、证据及支持关系的数据连接</title>
  <desc id="desc">原文用文档哈希和位置固定；声明保存版本与条件，并可绑定零到多份证据；证据保存来源、时间、快照哈希和引用片段。核验后分别记录支持、反驳、部分支持或证据不足。链接存在与片段存在都不等于语义关系已验证。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52718c"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #19334a; }
      .heading { font-size: 29px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 21px; fill: #496077; }
      .box { fill: #ffffff; stroke: #b9cddd; stroke-width: 2; }
      .flow { fill: none; stroke: #52718c; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="520" height="1160" rx="20" fill="#f3f7fb"/>
  <text x="260" y="48" text-anchor="middle" class="heading">一条声明如何获得证据</text>

  <rect x="28" y="82" width="464" height="128" rx="14" class="box"/>
  <text x="52" y="121" class="label">原文 document</text>
  <text x="52" y="157" class="body">document_sha256：固定全文版本</text>
  <text x="52" y="189" class="body">location：段落、行号或页码</text>
  <path d="M260 212 V250" class="flow"/>
  <text x="280" y="241" class="small">定位原句</text>

  <rect x="28" y="264" width="464" height="154" rx="14" class="box"/>
  <text x="52" y="303" class="label">声明 claim</text>
  <text x="52" y="339" class="body">claim_id · 原句 · 最小声明</text>
  <text x="52" y="371" class="body">version · 前置条件 · 依赖关系</text>
  <text x="52" y="401" class="small">例如：某版本开启 X 后支持某能力</text>
  <path d="M260 420 V458" class="flow"/>
  <text x="280" y="449" class="small">绑定 0 到多份</text>

  <rect x="28" y="472" width="464" height="184" rx="14" class="box"/>
  <text x="52" y="511" class="label">证据 evidence</text>
  <text x="52" y="547" class="body">evidence_id · 来源 · 抓取时间</text>
  <text x="52" y="579" class="body">snapshot_sha256 · 引用片段</text>
  <text x="52" y="611" class="body">片段位置 · 适用版本与时间</text>
  <text x="52" y="640" class="small">hash 固定快照，不证明来源正确</text>
  <path d="M260 658 V696" class="flow"/>
  <text x="280" y="687" class="small">逐条核验关系</text>

  <rect x="28" y="710" width="464" height="238" rx="14" fill="#e9f0fd" stroke="#adc2e2" stroke-width="2"/>
  <text x="52" y="749" class="label">声明与证据的关系 relation</text>
  <text x="52" y="789" class="body">supports：支持</text>
  <text x="52" y="823" class="body">contradicts：反驳</text>
  <text x="52" y="857" class="body">partial：部分支持</text>
  <text x="52" y="891" class="body">insufficient：证据不足</text>
  <text x="52" y="928" class="small">工具失败另记，不推断声明为假</text>

  <rect x="28" y="978" width="464" height="144" rx="14" fill="#fff5e4" stroke="#d8b87b" stroke-width="2"/>
  <text x="52" y="1016" class="label">关系必须经过核验</text>
  <text x="52" y="1054" class="body">链接可访问 ≠ 结论受支持</text>
  <text x="52" y="1089" class="body">片段确实存在 ≠ 语义已经验证</text>
</svg>
