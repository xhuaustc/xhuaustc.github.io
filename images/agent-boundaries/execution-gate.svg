<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1020" viewBox="0 0 500 1020" role="img" aria-labelledby="title desc">
  <title id="title">Agent 执行边界架构</title>
  <desc id="desc">可信控制面签发任务范围，模型提出动作后，每个动作经过执行入口校验。允许的动作由受限工具访问目标后端；拒绝的动作停止并报告。两条路径都记录审计，脱敏结果再交回模型。本文自建设计。</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#175cd3"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#067647"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b42318"/></marker>
  </defs>
  <rect width="500" height="1020" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" fill="#172b4d">
    <text x="250" y="44" font-size="25" font-weight="700">每个动作，都经过执行入口</text>
    <rect x="60" y="76" width="380" height="94" rx="12" fill="#eaf2ff" stroke="#175cd3" stroke-width="2"/>
    <text x="250" y="111" font-size="23" font-weight="700">可信控制面签发任务范围</text>
    <text x="250" y="145" font-size="20">身份 · 资源 · 操作 · 有效期</text>
    <path d="M250 170V202" fill="none" stroke="#175cd3" stroke-width="3" marker-end="url(#blue)"/>
    <rect x="60" y="210" width="380" height="86" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="250" y="244" font-size="23" font-weight="700">模型提出动作</text>
    <text x="250" y="276" font-size="20">提案不能扩大已有授权</text>
    <path d="M250 296V328" fill="none" stroke="#175cd3" stroke-width="3" marker-end="url(#blue)"/>
    <rect x="40" y="336" width="420" height="142" rx="14" fill="#eaf2ff" stroke="#175cd3" stroke-width="3"/>
    <text x="250" y="374" font-size="25" font-weight="700" fill="#175cd3">执行入口 · 不可绕过</text>
    <text x="250" y="409" font-size="21">校验身份、资源、参数</text>
    <text x="250" y="444" font-size="21">检查预算、有效期与批准记录</text>
    <path d="M153 478V530" fill="none" stroke="#067647" stroke-width="3" marker-end="url(#green)"/>
    <text x="106" y="512" font-size="21" font-weight="700" fill="#067647">允许</text>
    <path d="M377 478V530" fill="none" stroke="#b42318" stroke-width="3" marker-end="url(#red)"/>
    <text x="420" y="512" font-size="21" font-weight="700" fill="#b42318">拒绝</text>
    <rect x="40" y="538" width="225" height="112" rx="12" fill="#ecfdf3" stroke="#067647" stroke-width="2"/>
    <text x="153" y="580" font-size="23" font-weight="700">受限工具适配器</text>
    <text x="153" y="616" font-size="20">固定后端与资源映射</text>
    <rect x="295" y="538" width="165" height="112" rx="12" fill="#fff1f0" stroke="#b42318" stroke-width="2"/>
    <text x="377" y="580" font-size="23" font-weight="700" fill="#b42318">停止并报告</text>
    <text x="377" y="616" font-size="20">不换环境重试</text>
    <path d="M153 650V692" fill="none" stroke="#067647" stroke-width="3" marker-end="url(#green)"/>
    <rect x="40" y="700" width="225" height="90" rx="12" fill="#ecfdf3" stroke="#067647" stroke-width="2"/>
    <text x="153" y="735" font-size="23" font-weight="700">授权目标服务</text>
    <text x="153" y="768" font-size="20">只执行批准动作</text>
    <path d="M153 790V832" fill="none" stroke="#067647" stroke-width="3" marker-end="url(#green)"/>
    <path d="M377 650V832" fill="none" stroke="#b42318" stroke-width="3" marker-end="url(#red)"/>
    <rect x="40" y="840" width="420" height="116" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="250" y="875" font-size="23" font-weight="700">记录决策与执行结果</text>
    <text x="250" y="909" font-size="20">关联身份、任务、策略与请求 ID</text>
    <text x="250" y="939" font-size="20">仅将脱敏结果 / 拒绝原因交回模型</text>
    <text x="250" y="991" font-size="20" fill="#475569">本文自建设计 · 不是产品部署拓扑</text>
  </g>
</svg>
